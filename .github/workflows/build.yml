name: build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: rockchip_sd_tool-linux-x86_64
            bin: rockchip_sd_tool
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rockchip_sd_tool-linux-aarch64
            bin: rockchip_sd_tool
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rockchip_sd_tool-windows-x86_64
            bin: rockchip_sd_tool.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rockchip_sd_tool-macos-arm64
            bin: rockchip_sd_tool
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rockchip_sd_tool-macos-x86_64
            bin: rockchip_sd_tool
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Test
        # The Intel macOS binary is cross-compiled on the Apple silicon runner; its tests cannot run there.
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp README.md LICENSE CHANGELOG.md dist/
      - name: macOS app bundle
        if: runner.os == 'macOS'
        run: |
          APP="dist/Rockchip SD Tool.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/${{ matrix.target }}/release/rockchip_sd_tool "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Rockchip SD Tool</string>
            <key>CFBundleDisplayName</key><string>Rockchip SD Tool</string>
            <key>CFBundleIdentifier</key><string>com.thegammasqueeze.rockchip-sd-tool</string>
            <key>CFBundleVersion</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>rockchip_sd_tool</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>MIT License</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          # ditto keeps the bundle permissions and structure intact inside the zip.
          (cd dist && ditto -c -k --keepParent "Rockchip SD Tool.app" "Rockchip_SD_Tool.app.zip" && rm -rf "Rockchip SD Tool.app")
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-${{ steps.ver.outputs.version }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The changelog section for this version, followed by the install instructions.
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "## $VERSION" > notes.md; fi
          echo >> notes.md
          cat .github/release_instructions.md >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Rockchip SD Tool ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*.zip
